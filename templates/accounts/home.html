{% extends "base.html" %}

{% block title %}Pulpit{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Pulpit</h1>
    <span class="text-muted small">Zalogowany jako <strong>{{ user.username }}</strong></span>
</div>

<div class="row g-3">
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title"><i class="bi bi-ticket-perforated"></i> Zgłoszenia</h5>
                <p class="card-text text-muted small">Moduł w budowie.</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title"><i class="bi bi-pc-display"></i> Majątek</h5>
                <p class="card-text text-muted small">Moduł w budowie.</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title"><i class="bi bi-book"></i> Baza wiedzy</h5>
                <p class="card-text text-muted small">Moduł w budowie.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
