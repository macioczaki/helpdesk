{% extends "base.html" %}

{% block title %}Zaloguj się{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h1 class="h4 mb-4 text-center">
                    <i class="bi bi-shield-lock"></i> Logowanie
                </h1>

                {% if form.errors %}
                <div class="alert alert-danger">
                    Nieprawidłowa nazwa użytkownika lub hasło.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Nazwa użytkownika</label>
                        <input type="text" name="username" id="id_username"
                               class="form-control" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Hasło</label>
                        <input type="password" name="password" id="id_password"
                               class="form-control" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100">
                        Zaloguj się
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
